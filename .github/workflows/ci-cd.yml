name: CI/CD Biblioteca Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Testes Backend (JUnit + Mockito)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes unitários e de integração
        run: mvn -B test

  test-frontend:
    name: Testes e build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run build

  deploy:
    name: Build Docker + testes de aceitação
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      - name: Subir containers
        run: docker compose up -d

      - name: Aguardar backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/autores && break
            sleep 5
          done

      - name: Testes de aceitação (curl)
        run: |
          AUTOR_ID=$(curl -sf -X POST http://localhost:8080/api/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' | jq '.id')
          echo "Autor criado: $AUTOR_ID"
          curl -sf -X POST http://localhost:8080/api/livros \
            -H "Content-Type: application/json" \
            -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"978-8535910667\",\"anoPublicacao\":1899,\"genero\":\"Romance\",\"autor\":{\"id\":$AUTOR_ID}}"
          curl -sf http://localhost:8080/api/livros/autor/$AUTOR_ID | jq -e 'length == 1'
          curl -sf http://localhost:3000 > /dev/null

      - name: Derrubar containers
        if: always()
        run: docker compose down -v
